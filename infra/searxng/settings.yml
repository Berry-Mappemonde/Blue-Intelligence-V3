# Minimal SearXNG configuration for Blue Intelligence.
# - json format enabled (required by the PoE pipeline: /search?format=json)
# - limiter disabled (private instance, no Valkey/Redis)
# - engines without API keys. Checked on 2026-11-03 (image 2026.10.19), 12 pilot queries
#   each: startpage and yahoo answered 12/12, mojeek 10/12, duckduckgo 4/12 (CAPTCHA
#   after a few queries); brave answered 1 of 4, then "too many requests". SearXNG skips
#   a suspended engine, so the others still answer.
# - startpage / mojeek: inactive by default in SearXNG (proof-of-work CAPTCHA); both
#   answered here, so they are loaded with inactive: false.
# - wikipedia / wikidata: kept; they rarely match a ports-of-entry query.
# - off: google, qwant ("access denied"), google cse ("too many requests"; on in the
#   image defaults), bing ("HTTP connection error"), yep ("HTTP error"). presearch is
#   not in the image.
use_default_settings: true

general:
  instance_name: "Blue Intelligence SearXNG"
  enable_metrics: false

server:
  secret_key: "blue-intelligence-change-me"
  limiter: false
  public_instance: false
  bind_address: "127.0.0.1"
  port: 8890

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

valkey:
  url: false

engines:
  - name: startpage
    disabled: false
    inactive: false
  - name: yahoo
    disabled: false
  - name: mojeek
    disabled: false
    inactive: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: bing
    disabled: true
  - name: qwant
    disabled: true
  - name: yep
    disabled: true
